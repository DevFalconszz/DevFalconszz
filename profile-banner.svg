<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glassmorphism Reflection -->
    <linearGradient id="glass_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.1" />
      <stop offset="100%" stop-color="white" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rectangle -->
  <rect width="800" height="200" rx="20" fill="url(#bg_grad)" />

  <!-- Animated-like Abstract Background Circles -->
  <circle cx="700" cy="40" r="120" fill="#38bdf8" fill-opacity="0.05" />
  <circle cx="100" cy="160" r="80" fill="#818cf8" fill-opacity="0.08" />
  
  <!-- Content Container (Glassy feel) -->
  <rect x="40" y="40" width="720" height="120" rx="15" fill="url(#glass_grad)" stroke="white" stroke-opacity="0.1" />

  <!-- Text: Patrick Vagetti -->
  <text x="70" y="95" fill="white" font-family="system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.02em">
    PATRICK VAGETTI
  </text>
  
  <!-- Text: Roles -->
  <text x="70" y="125" fill="#38bdf8" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.1em" style="text-transform: uppercase;">
    AI Architect <tspan fill="white" fill-opacity="0.4">|</tspan> Fullstack Developer
  </text>

  <!-- Text: Tagline -->
  <text x="70" y="148" fill="white" fill-opacity="0.6" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400">
    Soft UI, Hard Logic • Building the future with AI
  </text>

  <!-- Modern Eagle/AI Shield Icon -->
  <g transform="translate(620, 55) scale(0.8)">
    <!-- Outer Shield -->
    <path d="M45 0L90 20V50C90 77.6 70 102.8 45 110C20 102.8 0 77.6 0 50V20L45 0Z" fill="url(#accent_grad)" filter="url(#glow)" />
    <!-- Eagle Head Silhouette -->
    <path d="M45 25C35 25 25 35 25 50C25 65 35 75 45 75C55 75 65 65 65 50C65 35 55 25 45 25ZM45 65C38 65 33 60 33 50C33 40 38 35 45 35C52 35 57 40 57 50C57 60 52 65 45 65Z" fill="white" />
    <path d="M45 15L75 45L45 75L15 45L45 15Z" fill="white" fill-opacity="0.2" />
    <!-- AI Core Dot -->
    <circle cx="45" cy="50" r="4" fill="white" />
  </g>
</svg>
